name: Full-stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-train.txt
      - run: python -m pip install -r backend/requirements-train.txt
      # Unit + API tests. They train tiny synthetic models themselves, so no committed model is needed.
      - run: python -m pytest -q backend/tests
      # Smoke-test the whole training/experiment pipeline on synthetic data (writes to a temp dir only).
      - run: python backend/train.py --source synthetic --quick --artifacts-dir "$RUNNER_TEMP/artifacts"
      - run: test -s "$RUNNER_TEMP/artifacts/models/model_bundle.joblib" && test -s "$RUNNER_TEMP/artifacts/public/results.json"
      # If a trained bundle is committed, it must load and answer with the committed sample.
      - name: Check committed model bundle
        run: |
          if [ -f backend/models/model_bundle.joblib ]; then
            python - <<'PY'
          import json, sys
          sys.path.insert(0, "backend")
          from app import create_app
          c = create_app().test_client()
          payload = json.load(open("backend/test_payload.json"))
          h = c.get("/health").get_json()
          r = c.post("/compare", json={"features": payload, "offline": list(payload)[:10]})
          assert h["model_loaded"], h
          assert r.status_code == 200, r.get_json()
          print("committed bundle OK:", h["model_id"], "synthetic =", h["synthetic"])
          PY
          else
            echo "No committed model bundle: skipped."
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: frontend/dist/
